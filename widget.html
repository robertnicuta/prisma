<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Grabador flotante</title><style>
:root{color-scheme:dark;--line:#303645;--muted:#919aad;--text:#f3f5fc;--accent:#ff615f}*{box-sizing:border-box}body{margin:0;background:transparent;color:var(--text);font:12px/1.5 'Segoe UI',sans-serif;overflow:hidden;padding:8px}
button,select,input{-webkit-app-region:no-drag;font:inherit}button{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;color:var(--text);background:#232835;border-radius:12px;height:38px;padding:0 12px;white-space:nowrap}button:hover:not(:disabled){background:#333b4e;border-color:#505b73}button:disabled{opacity:.32;cursor:default}button:focus-visible,select:focus-visible{outline:2px solid #aba2ff;outline-offset:2px}button svg{flex-shrink:0}
.shell{border:1px solid #3c4354;border-radius:24px;background:linear-gradient(135deg,#202534,#141720 65%);box-shadow:0 8px 20px #0005;overflow:hidden}.bar{height:86px;display:flex;align-items:center;gap:8px;padding:12px 14px;-webkit-app-region:drag}.grip{color:#657087;width:14px;flex-shrink:0}.portrait{width:54px;height:54px;border-radius:50%;background:#30384b;position:relative;overflow:hidden;display:grid;place-items:center;flex-shrink:0;border:2px solid #58627b}.portrait>span{color:#a9b4ce}#camera{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}#camera[src=""]{display:none}
.info{width:77px;flex-shrink:0}.info strong{font:600 19px 'Cascadia Mono',ui-monospace,monospace;letter-spacing:-.5px}.info small{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:10px}#dot{width:5px;height:5px;background:#8291af;border-radius:50%}#dot.active{background:var(--accent);box-shadow:0 0 8px #ff615f80}#record{background:var(--accent);color:#fff;height:44px;min-width:98px;font-weight:600;border-radius:14px;box-shadow:0 3px 12px #ff615f20}#record:hover{background:#ff7a78}.icon-btn{width:38px;flex-shrink:0;padding:0;background:transparent}.icon-btn[aria-pressed=true]{color:#b8b1ff;background:#a394ff1c;border-color:#aaa0ff35}.icon-btn.warn[aria-pressed=true]{color:#ffc77d;background:#ffb65d15;border-color:#ffb65d33}.icon-btn.danger:hover:not(:disabled){color:#ff8582;background:#ff615f18}.divider{width:1px;height:28px;background:#363c4d;margin:0 3px;flex-shrink:0}.spacer{flex:1}#hide{color:#919aad;width:28px}
.drawer{padding:0 18px 16px}.drawer[hidden]{display:none}.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}.drawer-head strong{font-size:14px}.drawer-head small{color:var(--muted)}.tabs{display:flex;gap:6px}.tabs button{height:30px;border-radius:9px;background:transparent;color:var(--muted)}.tabs button.active{background:#a394ff20;color:#c8c1ff}.content{max-height:470px;overflow-y:auto;scrollbar-width:thin;padding-right:3px}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.group{border:1px solid var(--line);border-radius:14px;background:#191d28;padding:12px;display:flex;flex-direction:column;gap:10px}.group h3{margin:0;color:#bbc4d7;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}.group label{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#a8b2c7}.group select{width:62%;min-width:0}.group .checks{display:flex;gap:12px;flex-wrap:wrap}.group .checks label{justify-content:start}.group input[type=range]{width:60%}.group input[type=checkbox]{accent-color:#b7adff;width:14px;height:14px}.group .actions{display:flex;gap:6px;flex-wrap:wrap}.group .actions button{height:30px;font-size:11px;border-radius:8px;padding:0 9px}select{color:var(--text);background:#242a38;border:1px solid #3a4355;border-radius:8px;height:31px;padding:0 7px;max-width:100%}#sourceNote,#mobileNote,#dirNote{color:var(--muted);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.drawer-foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:10px;color:#828da4}.drawer-foot button{height:29px;font-size:11px;background:transparent;color:#bbb5f7}
#transcriptPane[hidden],#settingsPane[hidden]{display:none}#transcriptPane p{color:#a8b2c7;margin:0 0 12px}.transcript-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#transcriptStatus{padding-top:10px;color:#a8b2c7}textarea{width:100%;height:230px;background:#11141c;color:#e4e9f5;border:1px solid var(--line);border-radius:12px;resize:none;padding:12px;font:12px/1.7 'Segoe UI',sans-serif;margin:12px 0}#transcriptCancel[hidden]{display:none}
.content{max-height:calc(100vh - 240px)}details summary{cursor:pointer;color:#c8c1ff;font-size:11px}#mobileInput{width:100%;margin:8px 0;padding:7px;background:#242a38;border:1px solid #3a4355;border-radius:8px;color:#e4e9f5}#mobileLink{display:block;font-size:10px;color:#a8b2c7;overflow-wrap:anywhere;margin-top:6px}
</style></head><body data-window="Grabador flotante"><div class="shell"><div class="bar">
<span class="grip" data-icon="grip" title="Arrastra el widget"></span><div class="portrait"><span data-icon="camera"></span><img id="camera" src="" alt="Cámara"></div><div class="info"><strong id="timer">00:00</strong><small><i id="dot"></i><span id="label">Listo</span></small></div>
<button id="record" aria-label="Grabar" title="Grabar · Ctrl+Shift+R"></button><button id="pause" class="icon-btn" aria-label="Pausar" title="Pausar · Ctrl+Shift+P" disabled></button><button id="mic" class="icon-btn warn" aria-label="Silenciar micro" title="Silenciar micro · Ctrl+Shift+M" aria-pressed="false"></button><button id="cameraToggle" class="icon-btn" aria-label="Mostrar cámara" title="Mostrar / ocultar cámara" aria-pressed="true"></button><span class="divider"></span>
<button id="zoom" class="icon-btn" aria-label="Zoom manual" title="Zoom al cursor · Ctrl+Shift+Z"></button><button id="prompter" class="icon-btn" aria-label="Abrir teleprompter" title="Teleprompter"></button><button id="transcript" class="icon-btn" aria-label="Transcripción" title="Transcripción local"></button><button id="discard" class="icon-btn danger" aria-label="Descartar grabación" title="Descartar grabación" disabled></button><span class="spacer"></span><span class="divider"></span>
<button id="settings" class="icon-btn" aria-label="Ajustes de grabación" title="Fuentes y ajustes" aria-expanded="false"></button><button id="openApp" class="icon-btn" aria-label="Abrir app" title="Abrir la app completa"></button><button id="hide" class="icon-btn" aria-label="Ocultar widget" title="Ocultar · Ctrl+Shift+W"></button></div>
<div id="drawer" class="drawer" hidden><div class="drawer-head"><div><strong>Tu grabación</strong><br><small id="detail">Todo a mano, sin salir del widget</small></div><div class="tabs"><button id="settingsTab" class="active">Ajustes</button><button id="transcriptTab">Transcripción</button></div></div><div class="content">
<div id="settingsPane" class="settings-grid">
<section class="group"><h3>Qué grabar</h3><label>Modo<select data-k="mode"></select></label><label>Pantalla<select data-k="src"></select></label><span id="sourceNote"></span><div class="actions"><button data-action="area">Elegir área</button><button id="areaOff" data-action="areaOff">Quitar área</button><button data-action="refresh">Actualizar</button></div></section>
<section class="group"><h3>Cámara y móvil</h3><label>Cámara<select data-k="cam"></select></label><div class="checks"><label><input type="checkbox" data-k="camShow">Mostrar</label><label><input type="checkbox" data-k="mirror">Espejo</label></div><details><summary>Conectar móvil · VDO.Ninja</summary><input id="mobileInput" placeholder="Enlace de VDO.Ninja o ID" aria-label="Enlace de VDO.Ninja"><div class="actions"><button id="mobileGenerate">Crear enlace</button><button id="mobileConnect">Conectar</button><button id="mobileCopy">Copiar al móvil</button><button id="mobileDisconnect">Desconectar</button></div><span id="mobileLink"></span></details><span id="mobileNote"></span></section>
<section class="group"><h3>Audio</h3><label>Micro<select data-k="mic"></select></label><div class="checks"><label><input type="checkbox" data-k="clean">Quitar ruido</label><label><input type="checkbox" data-k="sysAudio">Audio del sistema</label></div></section>
<section class="group"><h3>Burbuja de cámara</h3><label>Forma<select data-k="shape"></select></label><label>Borde<select data-k="border"></select></label><label>Tamaño<input type="range" data-k="size" min="120" max="700" step="10"></label></section>
<section class="group"><h3>Zoom y clics</h3><div class="checks"><label><input type="checkbox" data-k="autoZoom">Zoom al clic</label><label><input type="checkbox" data-k="ripple">Resaltar clics</label></div><label>Nivel<select data-k="autoLevel"></select></label><label>Duración<select data-k="autoSecs"></select></label><div class="actions"><button data-action="zoom-out">Restablecer zoom</button></div></section>
<section class="group"><h3>Calidad y guardado</h3><label>Resolución<select data-k="res"></select></label><label>Fotogramas<select data-k="fps"></select></label><label>Fondo<select data-k="bg"></select></label><label>Cuenta atrás<select data-k="countdown"></select></label><div class="actions"><button data-action="chdir">Cambiar carpeta</button><button data-action="openDir">Abrir carpeta</button></div><span id="dirNote"></span></section></div>
<section id="transcriptPane" hidden><p>Transcribe en tu PC con el mismo motor configurado en la app.</p><div class="transcript-actions"><button id="transcribeLast">Última grabación</button><button id="transcribeFile">Elegir archivo</button><select id="language" aria-label="Idioma"><option value="auto">Detectar idioma</option><option value="es">Español</option><option value="en">Inglés</option></select><button id="transcriptCancel" hidden>Cancelar</button></div><div id="transcriptStatus" role="status">Listo</div><textarea id="transcriptText" readonly placeholder="Aquí aparecerá tu transcripción." aria-label="Transcripción"></textarea><div class="transcript-actions"><button id="copyText" disabled>Copiar texto</button><button id="openTxt" disabled>Archivo TXT</button><button id="openSrt" disabled>Subtítulos SRT</button><button id="transcriptConfig">Configurar motor</button></div></section>
</div><div class="drawer-foot"><span>El widget no aparece en el vídeo</span><button id="fullApp">Abrir vista previa completa →</button></div></div></div>
<script src="brand.js"></script><script src="ui-icons.js"></script><script>
const $=id=>document.getElementById(id);let current={},pane='settings',expanded=false,transcriptBusy=false,transcriptResult;
document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
for(const [id,name] of Object.entries({record:'record',pause:'pause',mic:'mic',cameraToggle:'camera',zoom:'zoom',prompter:'prompt',transcript:'text',discard:'trash',settings:'settings',openApp:'app',hide:'close'}))buttonIcon($(id),name,id==='record'?'Grabar':null);
function update(s){
 current=s;const active=['rec','paused'].includes(s.state),idle=s.state==='idle';
 buttonIcon($('record'),active?'stop':'record',active?'Parar':'Grabar');$('record').disabled=!['idle','rec','paused'].includes(s.state);$('record').ariaLabel=active?'Parar grabación':'Grabar';
 buttonIcon($('pause'),s.state==='paused'?'play':'pause');$('pause').disabled=$('discard').disabled=!active;$('pause').title=$('pause').ariaLabel=s.state==='paused'?'Reanudar':'Pausar';
 buttonIcon($('mic'),s.muted?'micOff':'mic');$('mic').setAttribute('aria-pressed',String(s.muted));$('mic').ariaLabel=$('mic').title=s.muted?'Activar micro':'Silenciar micro';
 const cam=s.config?.camShow??true;buttonIcon($('cameraToggle'),cam?'camera':'cameraOff');$('cameraToggle').setAttribute('aria-pressed',String(cam));$('cameraToggle').ariaLabel=$('cameraToggle').title=cam?'Ocultar cámara':'Mostrar cámara';
 const sec=Math.floor(s.elapsed/1000);$('timer').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');$('label').textContent={idle:'Listo',rec:'Grabando',paused:'En pausa',countdown:'Preparando',stopping:'Guardando'}[s.state]||'Listo';$('dot').classList.toggle('active',s.state==='rec');$('detail').textContent=s.message||'Todo a mano, sin salir del widget';
 $('zoom').setAttribute('aria-pressed',String(s.zoom>1));$('zoom').title=`Zoom ${s.zoom||1}× · Ctrl+Shift+Z`;$('transcript').disabled=!idle;for(const id of ['transcribeLast','transcribeFile'])$(id).disabled=!idle||transcriptBusy;
 for(const el of document.querySelectorAll('[data-k]')){const k=el.dataset.k;if(el.tagName==='SELECT'&&s.options?.[k]){const signature=JSON.stringify(s.options[k]);if(el.dataset.signature!==signature){el.replaceChildren(...s.options[k].map(o=>new Option(o.name,o.id)));el.dataset.signature=signature;}}if(s.config&&document.activeElement!==el){if(el.type==='checkbox')el.checked=!!s.config[k];else el.value=s.config[k];}el.disabled=!!s.locked?.includes(k);}
 $('areaOff').disabled=!idle||!s.config?.area;document.querySelector('[data-action="area"]').disabled=!idle||!s.config?.src?.startsWith('screen');document.querySelector('[data-action="refresh"]').disabled=!idle;
 $('sourceNote').textContent=s.config?.area?'Área personalizada seleccionada':'Pantalla o ventana completa';$('mobileNote').textContent=s.mobile||'';$('dirNote').textContent=s.config?.dir||'';$('dirNote').title=s.config?.dir||'';
 if(document.activeElement!==$('mobileInput'))$('mobileInput').value=s.vdo?.url||'';$('mobileLink').textContent=s.vdo?.link||'';for(const id of ['mobileGenerate','mobileConnect','mobileInput'])$(id).disabled=!idle||s.vdo?.connecting;$('mobileDisconnect').disabled=!idle||!s.vdo?.connected||s.vdo?.connecting;$('mobileCopy').disabled=!s.vdo?.link;
}
const action=(name,value)=>api.invoke('widget-action',name,value).catch(e=>$('detail').textContent=e.message);
async function openPane(which){pane=which;expanded=true;$('drawer').hidden=false;$('settingsPane').hidden=which!=='settings';$('transcriptPane').hidden=which!=='transcript';$('settingsTab').classList.toggle('active',which==='settings');$('transcriptTab').classList.toggle('active',which==='transcript');$('settings').setAttribute('aria-expanded','true');await api.invoke('widget-expand',true);if(which==='transcript'){const info=await api.invoke('transcription-status');$('transcriptStatus').textContent=info.error||`Motor: ${info.settings.engine==='speaches'?'Speaches · Docker local':'Whisper integrado'}`;}}
$('settings').onclick=async()=>{if(expanded&&pane==='settings'){expanded=false;$('drawer').hidden=true;$('settings').setAttribute('aria-expanded','false');await api.invoke('widget-expand',false);}else openPane('settings');};
$('settingsTab').onclick=()=>openPane('settings');$('transcriptTab').onclick=$('transcript').onclick=()=>openPane('transcript');
for(const [id,name] of Object.entries({record:'toggle-record',pause:'toggle-pause',mic:'toggle-mute',cameraToggle:'toggle-camera',zoom:'zoom-in',prompter:'prompter',discard:'discard',openApp:'settings',fullApp:'settings',hide:'hide',transcriptConfig:'transcribe'}))$(id).onclick=()=>action(name);
$('mobileGenerate').onclick=()=>action('control',{id:'vdoGenerate'});$('mobileConnect').onclick=()=>action('control',{id:'vdoConnect',url:$('mobileInput').value});$('mobileCopy').onclick=()=>action('control',{id:'vdoCopy'});$('mobileDisconnect').onclick=()=>action('control',{id:'vdoDisconnect'});
document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>action('control',{id:el.dataset.action}));
document.querySelectorAll('[data-k]').forEach(el=>el.onchange=()=>action('configure',{key:el.dataset.k,value:el.type==='checkbox'?el.checked:el.value}));
async function transcribe(choose){if(transcriptBusy)return;transcriptBusy=true;update(current);$('transcriptCancel').hidden=false;$('transcriptStatus').textContent='Transcribiendo en este PC…';try{const result=await api.invoke('transcription-start',{choose,language:$('language').value});if(!result){$('transcriptStatus').textContent='Selección cancelada.';return;}transcriptResult=result;$('transcriptText').value=result.text;$('copyText').disabled=!result.text;$('openTxt').disabled=false;$('openSrt').disabled=!result.srt;$('transcriptStatus').textContent=result.text?'Texto guardado junto al vídeo.':'No se ha detectado voz.';}catch(e){$('transcriptStatus').textContent=e.message;}finally{transcriptBusy=false;$('transcriptCancel').hidden=true;update(current);}}
$('transcribeLast').onclick=()=>transcribe(false);$('transcribeFile').onclick=()=>transcribe(true);$('transcriptCancel').onclick=()=>api.invoke('transcription-cancel');$('copyText').onclick=()=>api.invoke('copy-text',$('transcriptText').value);$('openTxt').onclick=()=>api.invoke('show-file',transcriptResult.txt);$('openSrt').onclick=()=>api.invoke('show-file',transcriptResult.srt);
api.on('transcription-progress',info=>$('transcriptStatus').textContent=info.message||`Transcribiendo… ${info.percent}%`);api.on('widget-state',update);api.on('widget-camera',src=>$('camera').src=src||'');api.invoke('widget-state').then(update);
</script></body></html>
